name: Release signed MSIX
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'MSIX version, e.g. 2.0.0.0'
        required: true
        default: '2.3.6.0'
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Restore signing certificate
        shell: powershell
        env:
          PFX_B64: ${{ secrets.MSIX_PFX_BASE64 }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\dsh-signing.pfx", [Convert]::FromBase64String($env:PFX_B64))
      - name: Build production MSIX
        shell: powershell
        env:
          PUBLISHER: ${{ secrets.MSIX_PUBLISHER }}
          PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}
        run: .\scripts\Build-MSIX.ps1 -Version '${{ inputs.version }}' -Publisher $env:PUBLISHER -CertificatePath "$env:RUNNER_TEMP\dsh-signing.pfx" -CertificatePassword $env:PFX_PASSWORD
      - uses: actions/upload-artifact@v4
        with:
          name: DSH-Desktop-MSIX-Release
          path: dist/*.msix