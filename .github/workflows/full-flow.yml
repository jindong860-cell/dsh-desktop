name: Windows full-flow validation
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  full-flow:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Restore v2.3.9 source
        shell: powershell
        run: |
          $b64 = Get-Content .\ci-source.b64 -Raw
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\dsh-v239.zip", [Convert]::FromBase64String($b64))
          Expand-Archive "$env:RUNNER_TEMP\dsh-v239.zip" .\src -Force

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Rebuild Windows host from source
        shell: powershell
        working-directory: src
        run: |
          Push-Location host
          $env:GOOS='windows'
          $env:GOARCH='amd64'
          go build -trimpath -ldflags='-s -w -H=windowsgui' -o ..\prebuilt\DSHDesktopHost.exe .
          if ($LASTEXITCODE -ne 0) { throw 'Host build failed.' }
          Pop-Location

      - name: Build sign install and full verify
        shell: powershell
        working-directory: src
        timeout-minutes: 25
        run: .\scripts\Build-And-Install-Test-MSIX.ps1 -Version 2.3.9.0 -NoExplorer

      - name: Independent installed-app full-flow validation
        shell: powershell
        working-directory: src
        timeout-minutes: 20
        run: .\scripts\Validate-Full-Flow.ps1 -Version 2.3.9.0 -DeepRuntimeTest -RuntimeRoot "$env:RUNNER_TEMP\DSHDesktop-E2E"

      - name: Upload MSIX and validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DSH-Desktop-v2.3.9-full-flow
          if-no-files-found: warn
          path: |
            src/dist/*.msix
            src/dist/*.cer
            src/build-install.log
            src/full-flow-validation.log
            ${{ runner.temp }}/DSHDesktop-E2E/logs/**
